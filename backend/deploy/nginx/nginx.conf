events { worker_connections 1024; }
http {
  log_format safe '$request_method $status $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr crit;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $server_name zone=api_global:1m rate=150r/s;
  limit_conn_zone $server_name zone=api_connections:1m;
  server {
    listen 8080;
    server_name _;
    limit_req zone=api_global burst=100 nodelay;
    limit_conn api_connections 200;
    limit_req_status 429;
    limit_conn_status 503;
    error_page 429 = @rate_limited;
    error_page 503 = @server_busy;
    location @rate_limited { default_type application/json; add_header Retry-After 60 always; return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов"}}'; }
    location @server_busy { default_type application/json; add_header Retry-After 1 always; return 503 '{"error":{"code":"server_busy","message":"Сервис занят"}}'; }
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_read_timeout 20s;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = /openapi.yaml { alias /etc/banya/openapi.yaml; default_type application/yaml; }
    location /swagger/ { set $target swagger:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/admin/(security-events|me(?:/password)?|sessions(?:/[^/]+)?|employees(?:/[^/]+)?)$ { set $target identity:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/admin/baths(?:/[^/]+(?:/departments)?)?$ { set $target catalog:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/admin/orders/[^/]+/payments$ { set $target payment:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/orders/[^/]+/payments(?:/[^/]+)?$ { set $target payment:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/departments/[^/]+/(booking-config|resources|availability|availability-calendar)$ { set $target booking:8080; proxy_pass http://$target; }
    location ~ ^/api/v1/admin/departments/[^/]+(?:/info|/sync-retry)?$ { set $target catalog:8080; proxy_pass http://$target; }
    location /api/v1/departments/ { set $target catalog:8080; proxy_pass http://$target; }
    location /api/v1/baths { set $target catalog:8080; proxy_pass http://$target; }
    location /api/v1/ { set $target booking:8080; proxy_pass http://$target; }
    location / { return 404; }
  }
}
