openapi: 3.1.0
info:
  title: Сандуновские бани — backend MVP
  version: 1.3.2
  description: 'Только тестовая оплата, без фискализации и разрешения на фактический проход. Часовой пояс Asia/Yekaterinburg;
    суммы в копейках RUB. Все интервалы [начало, окончание). Администрирование бань и отделений, сотрудники (owner/admin),
    история, предпросмотры, PDF. Все PATCH требуют version и хотя бы одно изменение; при конфликте версии — 409.
    Явное active=false архивирует без удаления истории. Ограничения на клиентский IP: чтение 1200/мин, запись 300/мин,
    тяжёлые запросы 60/мин. Один IP может иметь 5 удержаний и 100 удержанных ресурсов; значения настраиваются. Подробная
    доступность ограничена 100000 элементов ресурс/интервал.'
servers:
- url: /
  description: Текущее локальное или серверное окружение
tags:
- name: Каталог
- name: Доступность
- name: Заказы
- name: Оплата
- name: Билет
- name: Администрирование
paths:
  /api/v1/baths:
    get:
      summary: Список действующих бань
      operationId: get__api_v1_baths
      tags:
      - Каталог
      description: Пагинация limit/offset; limit по умолчанию 50, максимум 100, offset до 10000.
      responses:
        '200':
          description: Успешный результат или безопасный повтор
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bath'
                  limit:
                    type: integer
                    minimum: 1
                  offset:
                    type: integer
                    minimum: 0
                required:
                - items
                - limit
                - offset
                additionalProperties: false
        '400':
          description: Ошибка ввода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действующий доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс отсутствует либо недоступен владельцу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт ресурса, состояния, цены, версии или ключа повтора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов или активных удержаний; учитывайте Retry-After
          headers:
            Retry-After:
              description: Рекомендуемая задержка повтора в секундах, если задана
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис, лимитер или бюджет тяжёлых запросов временно недоступен
          headers:
            Retry-After:
              description: Рекомендуемая задержка повтора в секундах, если задана
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
