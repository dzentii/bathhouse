          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс отсутствует либо недоступен владельцу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт ресурса, состояния, цены, версии или ключа повтора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailableResources:
                  summary: Недоступные места для подсветки на схеме
                  value:
                    error:
                      code: resource_unavailable
                      message: Часть выбора недоступна; ни один ресурс не удержан
                      details:
                        resource_ids:
                        - resource-id-1
                        - resource-id-3
        '429':
          description: Превышен лимит запросов или активных удержаний; учитывайте Retry-After
