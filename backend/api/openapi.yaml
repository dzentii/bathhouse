  /api/v1/orders/{orderID}/hold:
    post:
      summary: Удержать весь выбор на 10 минут и зафиксировать цену
      operationId: post__api_v1_orders_orderID_hold
      tags:
      - Заказы
      description: Повтор не продлевает expires_at. При конфликте не остаётся частичного удержания. Ошибка 409
        resource_unavailable содержит error.details.resource_ids — все недоступные ресурсы из текущего выбора
        в порядке selection.resource_ids (удержанные, подтверждённые или заблокированные). Свободные ресурсы,
        чужие заказы и контакты в список не включаются. Это состояние на момент проверки, а не резерв;
        актуальную схему можно перечитать через availability. Другие ошибки 409 не обязаны содержать details.
        При изменившейся цене перед оплатой подтвердите новую сумму и price_hash.
      responses:
        '200':
          description: Успешный результат или безопасный повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeldOrder'
        '400':
          description: Ошибка ввода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
