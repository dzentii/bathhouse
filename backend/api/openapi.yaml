components:
  securitySchemes:
    orderToken:
      type: http
      scheme: bearer
      description: order_token собственного заказа
    adminBearer:
      type: http
      scheme: bearer
      description: access_token административной сессии
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Изменяющие запросы требуют X-CSRF-Token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              $ref: '#/components/schemas/ResourceConflictDetails'
          required:
          - code
          - message
          allOf:
          - if:
              properties:
                code:
                  const: resource_unavailable
              required:
              - code
            then:
              required:
              - details
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    ResourceConflictDetails:
      type: object
      description: Детализация resource_unavailable при удержании заказа; только ресурсы из текущего выбора.
      properties:
        resource_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Все недоступные выбранные ресурсы в порядке selection.resource_ids. Идентификаторы совпадают с id в схеме ресурсов.
      required:
      - resource_ids
      additionalProperties: false
    Guest:
      type: object
      properties:
        category:
          type: string
          enum:
          - adult
          - child
        age:
          type: integer
          minimum: 0
          maximum: 120
          description: 'Для child: 0..17. Для adult возраст не передаётся. Ввод только age без category поддерживается
            для совместимости.'
        count:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - count
      additionalProperties: false
      oneOf:
      - required:
        - category
        properties:
          category:
            const: adult
        not:
          required:
          - age
      - required:
        - category
        - age
        properties:
          category:
            const: child
          age:
            maximum: 17
      - required:
        - age
        not:
          required:
          - category
    Buyer:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 10
          maxLength: 32
      required:
      - name
      - phone
      additionalProperties: false
    Selection:
      type: object
      properties:
        department_id:
          type: string
        resource_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        guests:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Guest'
      required:
      - department_id
      - resource_ids
      - starts_at
      - ends_at
      - guests
      additionalProperties: false
    Resource:
      type: object
      properties:
