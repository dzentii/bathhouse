                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис, лимитер или бюджет тяжёлых запросов временно недоступен
          headers:
            Retry-After:
              description: Рекомендуемая задержка повтора в секундах, если задана
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - orderToken: []
      parameters:
      - name: orderID
        in: path
        required: true
        schema:
