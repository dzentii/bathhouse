        '409':
          description: Конфликт ресурса, состояния, цены, версии или ключа повтора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов или активных удержаний; учитывайте Retry-After
          headers:
            Retry-After:
              description: Рекомендуемая задержка повтора в секундах, если задана
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис, лимитер или бюджет тяжёлых запросов временно недоступен
          headers:
            Retry-After:
              description: Рекомендуемая задержка повтора в секундах, если задана
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: Успешный результат или безопасный повтор
