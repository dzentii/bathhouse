      - adminCookie: []
      parameters:
      - name: departmentID
        in: path
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Случайный UUID v4 для POST/PUT/PATCH. Для повтора используйте тот же метод, URL и точное JSON-тело.
          Изменение операции при прежнем ключе — 409. Снимок успешного ответа хранится 24 часа (вход — до 8 часов);
          текущее состояние получают GET. Idempotency-Key поддерживается как устаревший псевдоним.
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Обязателен для изменяющих запросов при cookie-аутентификации; при bearer не требуется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRetry'
