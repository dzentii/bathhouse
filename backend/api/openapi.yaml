          type: string
          format: date
        to:
          type: string
          format: date
        server_time:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              status:
                type: string
                enum:
                - available
                - sold_out
                - closed
                - out_of_sale
                - unavailable
              available_slots:
                type: integer
                minimum: 0
              free_resources:
                type: integer
                minimum: 0
              genders:
                type: array
                items:
                  type: string
                  enum:
                  - male
                  - female
                  - mixed
            required:
            - date
            - status
            - available_slots
            - free_resources
            - genders
            additionalProperties: false
      required:
      - department_id
      - from
      - to
      - server_time
      - items
      additionalProperties: false
      description: От 1 до 31 дня включительно. available_slots — интервалы хотя бы с одним свободным ресурсом;
        free_resources — уникальные свободные ресурсы за день. Календарь не удерживает места.
