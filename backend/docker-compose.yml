name: banya-mvp

x-common-env: &common-env
  TRUSTED_PROXY_HOSTS: gateway,caddy
  GOMAXPROCS: ${APP_GOMAXPROCS:-2}
  GOMEMLIMIT: 192MiB
  HTTP_MAX_CONCURRENT: ${HTTP_MAX_CONCURRENT:-64}
  PUBLIC_RATE_PER_MINUTE: ${PUBLIC_RATE_PER_MINUTE:-1200}
  WRITE_RATE_PER_MINUTE: ${WRITE_RATE_PER_MINUTE:-300}
  HEAVY_RATE_PER_MINUTE: ${HEAVY_RATE_PER_MINUTE:-60}
  MAX_ACTIVE_HOLDS_PER_CLIENT: ${MAX_ACTIVE_HOLDS_PER_CLIENT:-5}
  MAX_HELD_RESOURCES_PER_CLIENT: ${MAX_HELD_RESOURCES_PER_CLIENT:-100}
  PDF_MAX_CONCURRENT: ${PDF_MAX_CONCURRENT:-2}
  PDF_CACHE_MIB: ${PDF_CACHE_MIB:-16}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  INBOX_RETENTION_DAYS: ${INBOX_RETENTION_DAYS:-90}
  APP_ENV: ${APP_ENV:-development}
  HTTP_ADDR: :8080
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run python scripts/init-env.py}
  REDIS_URL: redis://:${REDIS_PASSWORD:?missing REDIS_PASSWORD}@redis:6379/0
  KAFKA_ADDR: kafka:9092
  KAFKA_TOPIC: banya.events.v1
  IDENTITY_URL: http://identity:8080
  BOOKING_URL: http://booking:8080
  PAYMENT_URL: http://payment:8080
  CATALOG_URL: http://catalog:8080
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

x-catalog-env: &catalog-env
  <<: *common-env
  DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:?missing password}@postgres:5432/catalog?sslmode=disable
x-booking-env: &booking-env
  <<: *common-env
  DATABASE_URL: postgres://booking:${BOOKING_DB_PASSWORD:?missing password}@postgres:5432/booking?sslmode=disable
  ORDER_TOKEN_KEY: ${ORDER_TOKEN_KEY:?missing ORDER_TOKEN_KEY}
  TICKET_TOKEN_KEY: ${TICKET_TOKEN_KEY:?missing TICKET_TOKEN_KEY}
x-payment-env: &payment-env
  <<: *common-env
  DATABASE_URL: postgres://payment:${PAYMENT_DB_PASSWORD:?missing password}@postgres:5432/payment?sslmode=disable
x-identity-env: &identity-env
  <<: *common-env
  DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:?missing password}@postgres:5432/identity?sslmode=disable
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?missing ADMIN_PASSWORD}

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  mem_limit: 256m
  cpus: 1.0
  pids_limit: 128

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2.3-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD}', --appendonly, 'yes']
    environment: {REDISCLI_AUTH: '${REDIS_PASSWORD}'}
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic banya.events.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic banya.events.v1.dlq --partitions 1 --replication-factor 1
    restart: 'no'
  catalog:
    <<: *runtime
    image: banya-catalog:local
    build: {context: ., args: {SERVICE: catalog}}
    environment: *catalog-env
    depends_on: {migrate-catalog: {condition: service_completed_successfully}, redis: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
  booking:
    <<: *runtime
    image: banya-booking:local
    build: {context: ., args: {SERVICE: booking}}
    environment: *booking-env
    depends_on: {migrate-booking: {condition: service_completed_successfully}, kafka-init: {condition: service_completed_successfully}, redis: {condition: service_healthy}, identity: {condition: service_healthy}}
  payment:
    <<: *runtime
    image: banya-payment:local
    build: {context: ., args: {SERVICE: payment}}
    environment: *payment-env
    depends_on: {migrate-payment: {condition: service_completed_successfully}, kafka-init: {condition: service_completed_successfully}, booking: {condition: service_healthy}}
  identity:
    <<: *runtime
    image: banya-identity:local
    build: {context: ., args: {SERVICE: identity}}
    environment: *identity-env
    depends_on: {migrate-identity: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  migrate-catalog:
    image: banya-catalog:local
    build: {context: ., args: {SERVICE: catalog}}
    entrypoint: [/app/migrate]
    environment: {<<: *catalog-env, MIGRATIONS_PATH: /app/migrations}
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
  migrate-booking:
    image: banya-booking:local
    build: {context: ., args: {SERVICE: booking}}
    entrypoint: [/app/migrate]
    environment: {<<: *booking-env, MIGRATIONS_PATH: /app/migrations}
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
  migrate-payment:
    image: banya-payment:local
    build: {context: ., args: {SERVICE: payment}}
    entrypoint: [/app/migrate]
    environment: {<<: *payment-env, MIGRATIONS_PATH: /app/migrations}
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
  migrate-identity:
    image: banya-identity:local
    build: {context: ., args: {SERVICE: identity}}
    entrypoint: [/app/migrate]
    environment: {<<: *identity-env, MIGRATIONS_PATH: /app/migrations}
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment: {SWAGGER_JSON: /spec/openapi.yaml, BASE_URL: /swagger}
    volumes: [./api/openapi.yaml:/spec/openapi.yaml:ro]
    restart: unless-stopped
  gateway:
    image: nginx:1.28.0-alpine
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api/openapi.yaml:/etc/banya/openapi.yaml:ro
    depends_on: {catalog: {condition: service_healthy}, booking: {condition: service_healthy}, payment: {condition: service_healthy}, identity: {condition: service_healthy}, swagger: {condition: service_started}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backup:
    image: postgres:18.6-bookworm
    profiles: [ops]
    environment: {PGPASSWORD: '${POSTGRES_PASSWORD}'}
    entrypoint: [/bin/sh, /opt/banya/backup.sh]
    volumes: ['./deploy/backup.sh:/opt/banya/backup.sh:ro', '${BACKUP_DIR:-./backups}:/backups']
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
